name: Cross-repository E2E

# Safety invariant: this workflow must never create a live GitHub publish.
# It intentionally provides no GitHub credential to Raphael and fails before
# executing E2E work if its partner or publish posture is changed from dry_run.

on:
  push:
    branches: [main]
  # Temporary pre-merge verification path. Remove after this feature branch
  # has completed one successful GitHub-hosted run.
  pull_request:
  repository_dispatch:
    types: [ignis-main-updated]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ignis_ref:
        description: "Ignis tag, commit SHA, or branch to test (defaults to contracts-v1.2.0)"
        required: false
        type: string
      crlf_checkouts:
        description: "Exercise Windows-style fixture checkout line endings"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  secret-fixture-kind:
    name: Secret fixture propagation (disposable kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Narrow proof only. Never load a customer kubeconfig or publish to GitHub.
      # Pre-release proof for the paired Ignis digest-poll branch; pin a tag before merge.
      IGNIS_REF: codex/poll-image-digests
      E2E_IGNIS_BIN: ${{ github.workspace }}/ignis/controller/target/release/raphael-sandbox-controller
      RAPHAEL_FIXTURES_DIR: ${{ github.workspace }}/ignis/fixtures/secret_fixtures
      RAPHAEL_PARTNER_MODE: dry_run
      RAPHAEL_PUBLISH_MODE: dry_run
      GITHUB_TOKEN: ""
      RAPHAEL_GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Raphael
        run: python -m pip install -e agent -e dispatch
      - uses: actions/checkout@v4
        with:
          repository: AWaleed-Ahmed/Ignis
          ref: ${{ env.IGNIS_REF }}
          path: ignis
      - uses: dtolnay/rust-toolchain@stable
      - name: Build real Ignis
        run: cargo build --release --locked --manifest-path ignis/controller/Cargo.toml
      - name: Create disposable kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: raphael-fixture-proof
          wait: 120s
      - name: Preload test workload image
        run: |
          docker pull busybox:1.37.0
          kind load docker-image busybox:1.37.0 --name raphael-fixture-proof
      - name: Prove fixture consumption and missing-fixture control
        run: python -u e2e/run_secret_fixture_kind.py
      - name: Upload fixture proof and real HTTP traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-fixture-kind-${{ github.run_id }}
          path: e2e/kind-fixture-out/
          if-no-files-found: warn
      - name: Destroy disposable cluster
        if: always()
        run: kind delete cluster --name raphael-fixture-proof

  e2e:
    name: Ignis mock backend + Raphael dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Scheduled and Raphael-originated runs use the currently pinned public contract.
      # Ignis-originated repository_dispatch runs test the exact pushed Ignis revision.
      IGNIS_REF: ${{ inputs.ignis_ref || github.event.client_payload.ignis_ref || 'contracts-v1.2.0' }}
      E2E_IGNIS_BIN: ${{ github.workspace }}/ignis/controller/target/release/raphael-sandbox-controller
      RAPHAEL_PARTNER_MODE: dry_run
      RAPHAEL_PUBLISH_MODE: dry_run
      GITHUB_TOKEN: ""
      RAPHAEL_GITHUB_TOKEN: ""
      RAPHAEL_GITHUB_APP_ID: ""
      RAPHAEL_GITHUB_INSTALLATION_ID: ""
      RAPHAEL_GITHUB_APP_PRIVATE_KEY: ""
      RAPHAEL_GITHUB_APP_PRIVATE_KEY_PATH: ""
    steps:
      - name: Check out Raphael
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Raphael packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e agent -e dispatch

      - name: Enforce dry-run-only E2E posture
        shell: bash
        run: |
          test "$RAPHAEL_PARTNER_MODE" = "dry_run" || {
            echo "::error::Cross-repository E2E must run with RAPHAEL_PARTNER_MODE=dry_run."
            exit 1
          }
          test "$RAPHAEL_PUBLISH_MODE" = "dry_run" || {
            echo "::error::Cross-repository E2E must run with RAPHAEL_PUBLISH_MODE=dry_run."
            exit 1
          }
          test -z "$RAPHAEL_GITHUB_TOKEN" || {
            echo "::error::Cross-repository E2E must not receive RAPHAEL_GITHUB_TOKEN."
            exit 1
          }
          test -z "$GITHUB_TOKEN" || {
            echo "::error::Cross-repository E2E must not expose GITHUB_TOKEN to Raphael."
            exit 1
          }
          test -z "$RAPHAEL_GITHUB_APP_ID$RAPHAEL_GITHUB_INSTALLATION_ID$RAPHAEL_GITHUB_APP_PRIVATE_KEY$RAPHAEL_GITHUB_APP_PRIVATE_KEY_PATH" || {
            echo "::error::Cross-repository E2E must not expose GitHub App credentials to Raphael."
            exit 1
          }

      - name: Check out pinned Ignis revision
        uses: actions/checkout@v4
        with:
          repository: AWaleed-Ahmed/Ignis
          ref: ${{ env.IGNIS_REF }}
          path: ignis

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Ignis controller and embedded connector
        run: cargo build --release --locked --manifest-path ignis/controller/Cargo.toml

      # Disposable hosted runner only; production/user Git settings are untouched.
      # Set after source checkout so only harness fixture clones exercise CRLF.
      - name: Force CRLF fixture checkouts
        if: ${{ inputs.crlf_checkouts == true }}
        run: |
          git config --global core.autocrlf true
          git config --global --get core.autocrlf

      - name: Run three-scenario wire-protocol harness
        shell: bash
        run: |
          set -o pipefail
          python e2e/run_e2e.py 2>&1 | tee e2e/wire-protocol.log

      # This runner retains production hooks. It complements (rather than alters)
      # the deterministic three-scenario protocol harness above.
      - name: Run real-agent-hooks smoke
        shell: bash
        run: |
          set -o pipefail
          python e2e/run_real_job.py 2>&1 | tee e2e/real-hooks.log

      # §17.3 extends this existing cross-repository gate. It reuses the
      # production-hooks runner above for immutable scenario fixtures and
      # emits machine-scored evidence; it is not a separate CI system.
      - name: Run versioned evaluation scenarios
        shell: bash
        run: |
          set -o pipefail
          python -m unittest evals.test_run_evals
          python evals/run_evals.py 2>&1 | tee evals/evaluation.log

      - name: Verify LF wire content under CRLF checkout settings
        if: ${{ inputs.crlf_checkouts == true }}
        run: python -m evals.verify_rendered_lf

      - name: Upload E2E traces and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-repo-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            e2e/*.jsonl
            e2e/*.log
            evals/out/**
            evals/evaluation.log
