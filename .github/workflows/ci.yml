name: core-ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/tools/report_audit
      RAPHAEL_REPORT_AUDIT_FILE: ${{ github.workspace }}/report-audit.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install -e agent
      - name: Install dispatch
        run: python -m pip install -e dispatch
      - name: Test agent
        working-directory: agent
        run: python -m pytest -q
      - name: Test dispatch
        working-directory: dispatch
        run: python -m pytest -q
      - name: Test workflow, evaluation and wire assertions
        run: python -m unittest tools.tests.test_ci_workflows tools.tests.test_security_dependencies evals.test_run_evals e2e.test_wire_harness e2e.test_kind_verification e2e.test_lease_denial
      - name: Summarize persistence schema audit
        if: always()
        run: python tools/report_audit/escalation_report_audit.py report-audit.jsonl > report-audit-summary.json
      - name: Upload persistence schema audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-audit-${{ github.run_id }}
          path: report-audit*.json*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Ignis contracts
        shell: pwsh
        run: ./tools/sync-sandbox-contracts.ps1 -Check
