name: core-ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent
        run: python -m pip install --upgrade pip && python -m pip install -e agent
      - name: Install dispatch
        run: python -m pip install -e dispatch
      - name: Test agent
        working-directory: agent
        run: python -m pytest -q
      - name: Test dispatch
        working-directory: dispatch
        run: python -m pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Ignis contracts
        shell: pwsh
        run: ./tools/sync-sandbox-contracts.ps1 -Check
