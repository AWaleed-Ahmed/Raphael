# Unsafe privileged container — must be policy_blocked.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evil
  template:
    metadata:
      labels:
        app: evil
    spec:
      containers:
        - name: app
          image: ghcr.io/raphael/demo:1.0.0
          securityContext:
            privileged: true
