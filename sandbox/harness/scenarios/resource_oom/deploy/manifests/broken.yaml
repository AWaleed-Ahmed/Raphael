apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app: payments-api
    raphael.scenario: oom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: ghcr.io/raphael/demo:1.0.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 8Mi
            requests:
              memory: 8Mi
