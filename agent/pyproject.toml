[project]
name = "raphael-agent"
version = "0.1.0"
description = "Raphael self-healing deployment agent (Phase 0 skeleton + stubs)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pytest>=8.2",
]

[project.scripts]
raphael-agent-smoke = "raphael_agent.scripts.smoke:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["raphael_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
