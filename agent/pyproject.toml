[project]
name = "raphael-agent"
version = "0.2.0"
description = "Raphael self-healing deployment agent (Phase 1 ingest + Phase 0 graph stubs)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "langgraph>=0.2",
  "pydantic>=2.7",
  "pytest>=8.2",
  "starlette>=0.38",
  "uvicorn>=0.30",
  "joblib>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.scripts]
raphael-agent-smoke = "raphael_agent.scripts.smoke:main"
raphael-agent-serve = "raphael_agent.http_api.app:main"
raphael-agent-demo = "raphael_agent.scripts.demo_partner:main"
raphael-agent-go-nogo = "raphael_agent.scripts.pilot_go_nogo:main"
raphael-agent-feedback = "raphael_agent.scripts.record_feedback:main"
raphael-agent-metrics = "raphael_agent.scripts.metrics:main"
raphael-agent-learn = "raphael_agent.scripts.learn:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["raphael_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "kind: exercises live sandbox controller (kind cluster on RAPHAEL_SANDBOX_URL)",
]
