[project]
name = "raphael-dispatch"
version = "0.1.0"
description = "Connector protocol dispatch orchestration service"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pytest>=8.2",
  "starlette>=0.38",
  "uvicorn>=0.30",
]

[project.scripts]
raphael-dispatch-serve = "raphael_dispatch.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["raphael_dispatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
