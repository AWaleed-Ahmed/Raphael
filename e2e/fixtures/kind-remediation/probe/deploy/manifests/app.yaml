apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent
          args: ["-listen=:8080", "-text=healthy"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 9090
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
